spring:
  application:
    name: api-gateway
  
server:
  port: 8080

# JWT Configuration (must match workflow-service's secret, which issues the tokens)
jwt:
  secret: ${JWT_SECRET:changeme-this-is-not-secure-for-production-use-at-least-32-chars}

# Routing and rate limiting
gateway:
  workflow-service-url: ${WORKFLOW_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${WORKFLOW_SERVICE_CONNECTION_TIMEOUT:5s}
  read-timeout: ${WORKFLOW_SERVICE_READ_TIMEOUT:30s}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:120}

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.chronos: ${LOGGING_LEVEL_COM_CHRONOS:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      # Liveness/readiness groups, also served on the main server port as /livez and /readyz
      # (actuator itself runs on a separate management port in the docker profile)
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    export:
      prometheus:
        enabled: true
