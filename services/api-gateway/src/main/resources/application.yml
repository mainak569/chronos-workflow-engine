spring:
  application:
    name: api-gateway
  
server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:default-secret-key-change-in-production-min-256-bits-required}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Workflow Service URL
workflow-service:
  url: ${WORKFLOW_SERVICE_URL:http://localhost:8081}

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.chronos: ${LOGGING_LEVEL_COM_CHRONOS:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
