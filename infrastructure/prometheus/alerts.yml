# Chronos alert rules, evaluated by Prometheus (see rule_files in prometheus.yml).
# Every expression uses metrics the services actually export at /actuator/prometheus.
groups:
  - name: chronos-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|workflow-service|scheduler-service|worker-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} instance {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for over 1 minute."

      - alert: NoWorkersAvailable
        expr: absent(up{job="worker-service"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No worker instances are running"
          description: "Dispatched tasks will not be executed until a worker comes back."

      - alert: NoSchedulerLeader
        expr: sum(chronos_scheduler_leader) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No scheduler instance holds leadership"
          description: "Retries, recovery sweeps, cron schedules and the outbox publisher only run on the leader."

  - name: chronos-execution
    rules:
      - alert: HighWorkflowFailureRate
        expr: |
          sum(rate(chronos_workflow_executions_total{status="FAILED"}[10m]))
            / sum(rate(chronos_workflow_executions_total{status=~"COMPLETED|FAILED"}[10m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of workflow executions are failing"
          description: "Failure ratio over the last 10 minutes is {{ $value | humanizePercentage }}."

      - alert: TasksDeadLettered
        expr: sum(increase(chronos_task_dlq_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Tasks were moved to the dead letter queue"
          description: "{{ $value }} task(s) exhausted their retries in the last 15 minutes (topic chronos.task.failed.permanently)."

      - alert: OutboxBacklog
        expr: max(chronos_outbox_pending) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox messages are not being published"
          description: "{{ $value }} TaskReady messages are waiting; check Kafka connectivity and scheduler leadership."

      - alert: KafkaConsumerLag
        expr: max by (job) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is falling behind on Kafka"
          description: "Maximum consumer lag is {{ $value }} records."
