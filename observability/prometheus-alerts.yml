# Prometheus alerting rules for Chronos

groups:
  - name: chronos_workflow_alerts
    interval: 30s
    rules:
      - alert: HighWorkflowFailureRate
        expr: |
          (
            rate(chronos_workflow_failures_total[5m]) 
            / 
            rate(chronos_workflow_executions_total[5m])
          ) > 0.10
        for: 5m
        labels:
          severity: critical
          component: workflow
        annotations:
          summary: "High workflow failure rate detected"
          description: "Workflow failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"
          dashboard: "http://grafana:3000/d/workflow-execution"

      - alert: WorkflowDurationExceedsSLA
        expr: |
          histogram_quantile(0.95, rate(chronos_workflow_duration_seconds_bucket[5m])) > 300
        for: 10m
        labels:
          severity: warning
          component: workflow
        annotations:
          summary: "Workflow duration exceeds SLA"
          description: "P95 workflow duration is {{ $value }}s (threshold: 300s)"

  - name: chronos_task_alerts
    interval: 30s
    rules:
      - alert: HighTaskFailureRate
        expr: |
          (
            rate(chronos_task_executions_total{status="FAILED"}[5m])
            /
            rate(chronos_task_executions_total[5m])
          ) > 0.20
        for: 5m
        labels:
          severity: warning
          component: task
        annotations:
          summary: "High task failure rate: {{ $labels.task_type }}"
          description: "Task failure rate is {{ $value | humanizePercentage }} for {{ $labels.task_type }}"

      - alert: HighTaskRetryRate
        expr: |
          rate(chronos_task_retries_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: task
        annotations:
          summary: "High task retry rate: {{ $labels.task_type }}"
          description: "Task {{ $labels.task_type }} is retrying {{ $value }} times per second"

      - alert: TaskQueueBacklog
        expr: |
          chronos_task_queue_depth > 100
        for: 10m
        labels:
          severity: warning
          component: task
        annotations:
          summary: "Task queue backlog for {{ $labels.task_type }}"
          description: "Queue depth is {{ $value }} for {{ $labels.task_type }}"

  - name: chronos_worker_alerts
    interval: 30s
    rules:
      - alert: WorkerDown
        expr: |
          (time() - chronos_worker_heartbeat_timestamp) > 120
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "Worker {{ $labels.worker_id }} is down"
          description: "No heartbeat from {{ $labels.worker_id }} for {{ $value }}s"

      - alert: LowWorkerAvailability
        expr: |
          sum(chronos_worker_available) < 2
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "Low worker availability"
          description: "Only {{ $value }} workers available (threshold: 2)"

      - alert: HighWorkerUtilization
        expr: |
          avg(chronos_worker_utilization_ratio) > 0.90
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "High worker utilization"
          description: "Average worker utilization is {{ $value | humanizePercentage }}"

  - name: chronos_kafka_alerts
    interval: 30s
    rules:
      - alert: HighKafkaConsumerLag
        expr: |
          kafka_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "High Kafka consumer lag: {{ $labels.topic }}"
          description: "Consumer lag is {{ $value }} messages on {{ $labels.topic }}"

      - alert: KafkaMessageProcessingErrors
        expr: |
          rate(chronos_kafka_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Kafka processing errors on {{ $labels.topic }}"
          description: "{{ $value }} errors per second on {{ $labels.topic }}"

  - name: chronos_scheduler_alerts
    interval: 30s
    rules:
      - alert: NoSchedulerLeader
        expr: |
          sum(chronos_scheduler_leader) == 0
        for: 2m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "No scheduler leader elected"
          description: "No scheduler instance is currently the leader"

      - alert: HighSchedulingLag
        expr: |
          histogram_quantile(0.95, rate(chronos_scheduler_lag_seconds_bucket[5m])) > 60
        for: 10m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "High scheduling lag"
          description: "P95 scheduling lag is {{ $value }}s (threshold: 60s)"

  - name: chronos_system_alerts
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.90
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage: {{ $labels.application }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }}"

      - alert: HighGCTime
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m]) > 0.10
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High GC time: {{ $labels.application }}"
          description: "GC time is {{ $value | humanizePercentage }} of total time"

      - alert: ServiceDown
        expr: |
          up == 0
        for: 1m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}"
