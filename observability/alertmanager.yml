global:
  resolve_timeout: 5m
  # SMTP configuration (update with your SMTP server)
  smtp_from: 'alertmanager@chronos.local'
  smtp_smarthost: 'smtp.example.com:587'
  smtp_auth_username: 'alertmanager@chronos.local'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts go to PagerDuty and email
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Warning alerts go to Slack
    - match:
        severity: warning
      receiver: 'warning-alerts'
    
    # Workflow-specific alerts
    - match:
        component: workflow
      receiver: 'workflow-team'
    
    # Worker-specific alerts
    - match:
        component: worker
      receiver: 'worker-team'

# Inhibition rules - suppress alerts based on other alerts
inhibit_rules:
  # Suppress workflow failures if service is down
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      component: 'workflow'
    equal: ['service']
  
  # Suppress task alerts if worker is down
  - source_match:
      severity: 'critical'
      alertname: 'WorkerDown'
    target_match:
      component: 'task'
    equal: ['worker_id']

# Receivers - notification channels
receivers:
  # Default receiver (console)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  # Critical alerts - PagerDuty + Email
  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
    email_configs:
      - to: 'oncall@chronos.local'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'

  # Warning alerts - Slack
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#chronos-alerts'
        title: 'Chronos Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'warning'
        send_resolved: true

  # Workflow team - Email + Slack
  - name: 'workflow-team'
    email_configs:
      - to: 'workflow-team@chronos.local'
        headers:
          Subject: '[WORKFLOW] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#workflow-team'
        title: 'Workflow Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  # Worker team - Email
  - name: 'worker-team'
    email_configs:
      - to: 'worker-team@chronos.local'
        headers:
          Subject: '[WORKER] {{ .GroupLabels.alertname }}'
